[package]
name = "comment-lint"
version = "0.1.0"
edition = "2021"
description = "STE-inspired linter for source code comments"
license = "MIT"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.20"
tree-sitter-ruby = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-typescript = "0.20"
