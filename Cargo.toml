[package]
name = "comment-lint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Comment-bloat linter with STE-inspired prose rules"
license = "MIT"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-ruby = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
